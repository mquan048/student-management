<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title th:text="${isEdit} ? 'Chỉnh Sửa Sinh Viên' : 'Thêm Sinh Viên Mới'">Form Sinh Viên</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 560px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 16px;
            color: #6b7280;
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #4f46e5;
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            margin-bottom: 6px;
            font-weight: 600;
            font-size: 14px;
            color: #374151;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-cancel {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-cancel:hover {
            background-color: #d1d5db;
        }
    </style>
</head>

<body>
    <div class="container">
        <a href="/students" class="back-link">← Quay về danh sách</a>
        <h1 th:text="${isEdit} ? '✏️ Chỉnh Sửa Sinh Viên' : '➕ Thêm Sinh Viên Mới'">Form Sinh Viên</h1>

        <!-- Nếu isEdit = true → POST /students/{id}, ngược lại POST /students -->
        <form th:action="${isEdit} ? @{/students/{id}(id=${student.id})} : @{/students}" method="POST"
            th:object="${student}">

            <div class="form-group">
                <label for="name">Họ và Tên</label>
                <input type="text" id="name" th:field="*{name}" placeholder="Nhập họ và tên..." required />
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" th:field="*{email}" placeholder="Nhập email..." required />
            </div>

            <div class="form-group">
                <label for="age">Tuổi</label>
                <input type="number" id="age" th:field="*{age}" placeholder="Nhập tuổi..." min="1" max="150"
                    required />
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">💾 Lưu</button>
                <a href="/students" class="btn btn-cancel">Hủy</a>
            </div>
        </form>
    </div>
</body>

</html>
