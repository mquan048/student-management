<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Danh Sách Sinh Viên</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 30px;
        }

        h1 {
            font-size: 24px;
            color: #1a1a2e;
            margin-bottom: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }

        .search-form {
            display: flex;
            gap: 8px;
        }

        .search-form input[type="text"] {
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            width: 260px;
            outline: none;
            transition: border-color 0.2s;
        }

        .search-form input[type="text"]:focus {
            border-color: #4f46e5;
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1);
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-search {
            background-color: #e5e7eb;
            color: #374151;
        }

        .btn-search:hover {
            background-color: #d1d5db;
        }

        .btn-primary {
            background-color: #4f46e5;
            color: #fff;
        }

        .btn-primary:hover {
            background-color: #4338ca;
        }

        .btn-detail {
            background-color: #eef2ff;
            color: #4f46e5;
            padding: 6px 12px;
            font-size: 13px;
        }

        .btn-detail:hover {
            background-color: #e0e7ff;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background-color: #f8f9fa;
        }

        th,
        td {
            padding: 12px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
            font-size: 14px;
        }

        th {
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 0.5px;
        }

        tbody tr:hover {
            background-color: #f9fafb;
        }

        .text-danger {
            background-color: #fef2f2;
            color: #dc2626;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #9ca3af;
            font-size: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📋 Danh Sách Sinh Viên</h1>

        <div class="toolbar">
            <form class="search-form" action="/students" method="GET">
                <input type="text" name="keyword" th:value="${keyword}" placeholder="🔍 Tìm kiếm theo tên..." />
                <button type="submit" class="btn btn-search">Tìm</button>
            </form>
            <a href="/students/new" class="btn btn-primary">＋ Thêm Mới</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th>Tuổi</th>
                    <th>Thao Tác</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="student : ${dsSinhVien}" th:class="${student.age < 18} ? 'text-danger' : ''">
                    <td th:text="${#strings.abbreviate(student.id, 8)}">ID</td>
                    <td th:text="${student.name}">Tên</td>
                    <td th:text="${student.email}">Email</td>
                    <td th:text="${student.age}">0</td>
                    <td>
                        <a th:href="@{/students/{id}(id=${student.id})}" class="btn btn-detail">Xem Chi Tiết</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(dsSinhVien)}">
                    <td colspan="5" class="empty-state">Không có sinh viên nào.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
